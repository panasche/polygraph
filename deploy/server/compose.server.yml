# Polygraph Cloud on one server (see docs/DEPLOY-SERVER.md).
#
# Layered on top of the main docker-compose.yml. Always run it through the
# wrapper, which passes both files and the right .env:
#
#   ./deploy/server/polygraph.sh up -d --build
#
# What this changes from the local stack:
#   - ENVIRONMENT=staging: the dev login is gone and the API refuses to start
#     with weak secrets, SQLite or a plain-HTTP URL.
#   - No service publishes a port except Caddy (80 and 443). Postgres, the S3
#     server, the queue, the API and the web app are reachable only inside the
#     Docker network.
#   - S3 credentials come from deploy/server/s3.json, generated by init-env.sh.
#   - Caddy terminates HTTPS with a free Let's Encrypt certificate.

services:
  postgres:
    ports: !reset []

  s3:
    ports: !reset []
    volumes:
      - ./deploy/server/s3.json:/etc/seaweedfs/s3.json:ro

  elasticmq:
    ports: !reset []

  migrate:
    environment:
      ENVIRONMENT: staging

  api:
    ports: !reset []
    environment:
      ENVIRONMENT: staging
      # Caddy is the only proxy in front of the API and sets X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "1"

  worker:
    environment:
      ENVIRONMENT: staging

  web:
    ports: !reset []

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/server/.env}
    volumes:
      - ./deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
