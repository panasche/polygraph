# ElasticMQ (SQS-compatible) for the local stack. Mirrors infra/modules/queue:
# main queue + DLQ, 300 s visibility, long polling, 5 receives before the DLQ.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = ap-south-1
  accountId = 000000000000
}

queues {
  polygraph-uploads-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  polygraph-uploads {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "polygraph-uploads-dlq"
      maxReceiveCount = 5
    }
  }
}
