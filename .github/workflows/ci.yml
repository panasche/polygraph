name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------------------
  python-package:
    name: pytest-polygraph (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: packages/pytest-polygraph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/pytest-polygraph/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,worlds,otel]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Tests
        # `coverage run` rather than pytest-cov: the plugin's pytest11 entry point imports
        # polygraph before pytest-cov starts measuring, which under-reports coverage.
        run: |
          python -m coverage run --source=polygraph -m pytest
          python -m coverage report --show-missing --fail-under=90
          python -m coverage xml

      - name: Example suite
        working-directory: packages/pytest-polygraph/examples/bank
        run: python -m pytest --polygraph-auto --polygraph-json=../../.polygraph/example-results.json

  # ---------------------------------------------------------------------------
  benchmark:
    name: benchmark harness (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: benchmark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            benchmark/pyproject.toml
            packages/pytest-polygraph/pyproject.toml

      - name: Install
        # No framework extras and no API keys: the tests use the scripted agents and
        # fake models only, and skip the framework smoke tests.
        run: python -m pip install -e ../packages/pytest-polygraph -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests (offline, includes the end-to-end dry run of all three worlds)
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  cloud-api:
    name: cloud API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polygraph
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: polygraph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polygraph -d polygraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://polygraph:ci-only-not-a-secret@localhost:5432/polygraph_test
      POLYGRAPH_TEST_DATABASE_URL: postgresql+psycopg://polygraph:ci-only-not-a-secret@localhost:5432/polygraph_test
      STORAGE_BACKEND: local
      QUEUE_BACKEND: inline
      PII_SCANNER: regex
    defaults:
      run:
        shell: bash
        working-directory: cloud/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            cloud/api/pyproject.toml
            packages/pytest-polygraph/pyproject.toml

      - name: Install
        run: |
          python -m pip install -e ../../packages/pytest-polygraph --no-deps
          python -m pip install -e ".[test]" ruff

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Migrations apply cleanly
        run: python -m polygraph_cloud.cli migrate

      - name: Tests (PostgreSQL 16)
        run: python -m pytest -q

      - name: Image builds
        run: |
          docker build --pull --quiet --build-context polygraph_pkg=../../packages/pytest-polygraph -t polygraph-cloud:ci .
          user="$(docker image inspect --format '{{.Config.User}}' polygraph-cloud:ci)"
          [[ -n "$user" && "$user" != root && "$user" != 0* ]] || { echo "::error::API image runs as root"; exit 1; }

  # ---------------------------------------------------------------------------
  web:
    name: cloud web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

      - name: Image builds
        run: |
          docker build --pull --quiet -t polygraph-web:ci .
          user="$(docker image inspect --format '{{.Config.User}}' polygraph-web:ci)"
          [[ -n "$user" && "$user" != root && "$user" != 0* ]] || { echo "::error::web image runs as root"; exit 1; }

  # ---------------------------------------------------------------------------
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.12"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff infra

      - name: Environments share one main.tf
        run: |
          diff -u infra/envs/staging/main.tf infra/envs/production/main.tf
          diff -u infra/envs/staging/outputs.tf infra/envs/production/outputs.tf
          diff -u infra/envs/staging/providers.tf infra/envs/production/providers.tf

      - name: Validate
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/envs/staging infra/envs/production; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Trivy (misconfiguration scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: infra/.trivyignore

      - name: Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yaml
          quiet: true
          output_format: cli

  # ---------------------------------------------------------------------------
  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}"
          ./actionlint -color

  # ---------------------------------------------------------------------------
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
