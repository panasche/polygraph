name: Release

# Publishes pytest-polygraph with PyPI trusted publishing (no API token).
# One-time setup on PyPI and TestPyPI: add a trusted publisher for
#   owner polygraph-dev, repo polygraph, workflow release.yml,
#   environment "testpypi" (TestPyPI) and "pypi" (PyPI).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    defaults:
      run:
        working-directory: packages/pytest-polygraph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("src/polygraph/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text).group(1))
          PY
          )"
          if [[ "v${version}" != "$TAG" ]]; then
            echo "::error::Tag ${TAG} does not match package version ${version}"
            exit 1
          fi
          echo "Releasing ${version}"

      - name: Build
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/wheel-test/bin/polygraph --help >/dev/null
          /tmp/wheel-test/bin/python -m pytest --help | grep -q -- "--polygraph-auto"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/pytest-polygraph/dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/pytest-polygraph/dist/
          if-no-files-found: error
          retention-days: 30

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pytest-polygraph/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  verify-testpypi:
    name: Install from TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the just-published version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The index can take a minute to show a new release.
          for attempt in $(seq 1 10); do
            if python -m pip install --disable-pip-version-check \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "pytest-polygraph==${version}"; then
              break
            fi
            if [[ "$attempt" == 10 ]]; then
              echo "::error::pytest-polygraph ${version} never became installable from TestPyPI"
              exit 1
            fi
            sleep 30
          done
          polygraph --help >/dev/null
          python -m pytest --help | grep -q -- "--polygraph-auto"

  pypi:
    name: Publish to PyPI
    needs: verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-polygraph/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --generate-notes --title "pytest-polygraph ${TAG}"
