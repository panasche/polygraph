# Alembic config for running "alembic" by hand from cloud/api.
# Prefer: python -m polygraph_cloud.cli migrate  (reads DATABASE_URL).
[alembic]
script_location = src/polygraph_cloud/migrations
prepend_sys_path = src
# sqlalchemy.url is read from DATABASE_URL by env.py when left empty.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
