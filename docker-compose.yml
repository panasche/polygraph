# Full Polygraph Cloud stack on your machine.
#
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:3000        (web; /api/* is proxied to the API)
#   API directly: http://localhost:8000/api/health
#
# Same shape as production: Postgres 16, S3-compatible storage, an SQS-compatible
# queue, the API, the worker and the web app. Every value here is a local
# development value; none of it is a real secret.
#
# S3: MinIO's public container images are no longer published on Docker Hub,
# so this uses SeaweedFS's S3 gateway. Any S3-compatible server works: point
# S3_ENDPOINT_URL at it.

name: polygraph

x-backend-env: &backend-env
  ENVIRONMENT: development
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-polygraph}:${POSTGRES_PASSWORD:-polygraph-local-only}@postgres:5432/${POSTGRES_DB:-polygraph}
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:-polygraph-results}
  S3_ENDPOINT_URL: http://s3:8333
  KMS_KEY_ID: ${KMS_KEY_ID:-}
  QUEUE_BACKEND: sqs
  SQS_QUEUE_URL: http://elasticmq:9324/000000000000/polygraph-uploads
  SQS_ENDPOINT_URL: http://elasticmq:9324
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-local-dev-access-key}
  AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-local-dev-insecure-secret-key}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-https://polygraphmcp.dev}
  LEADERBOARD_PROJECT: ${LEADERBOARD_PROJECT:-polygraph-dev/benchmark}
  PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-10-13}
  PII_SCANNER: ${PII_SCANNER:-regex}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polygraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polygraph-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-polygraph}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./infra/local/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: create the results bucket (versioned, like production).
  s3-init:
    image: amazon/aws-cli:2.37.13
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY:-local-dev-access-key}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_KEY:-local-dev-insecure-secret-key}
      AWS_DEFAULT_REGION: ap-south-1
      BUCKET: ${S3_BUCKET:-polygraph-results}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $(seq 1 30); do
          aws --endpoint-url http://s3:8333 s3api list-buckets >/dev/null 2>&1 && break
          sleep 2
        done
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://s3:8333 s3api create-bucket --bucket "$$BUCKET"
        aws --endpoint-url http://s3:8333 s3api put-bucket-versioning --bucket "$$BUCKET" \
          --versioning-configuration Status=Enabled || true
        echo "bucket $$BUCKET ready"
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:9324:9324"
      - "127.0.0.1:9325:9325"
    restart: unless-stopped

  # One-shot: database migrations, run before the API and worker start
  # (production does the same as a one-off ECS task).
  migrate:
    build: &api-build
      context: cloud/api
      additional_contexts:
        polygraph_pkg: packages/pytest-polygraph
    image: polygraph/api:local
    command: ["python", "-m", "polygraph_cloud.cli", "migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: polygraph/api:local
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    image: polygraph/api:local
    command: ["python", "-m", "polygraph_cloud.worker"]
    environment: *backend-env
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: cloud/web
      dockerfile: Dockerfile
      args:
        # Baked in at build time (the /api rewrite and the prerendered pages).
        API_ORIGIN: http://api:8000
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
        PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-10-13}
        GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-polygraph-for-mcp}
        HOSTING: ${HOSTING:-aws-mumbai}
        SOURCE_URL: ${SOURCE_URL:-https://github.com/polygraph-dev/polygraph}
        SECURITY_EMAIL: ${SECURITY_EMAIL:-security@polygraphmcp.dev}
        GRIEVANCE_EMAIL: ${GRIEVANCE_EMAIL:-grievance@polygraphmcp.dev}
        # Set but empty means no status page.
        STATUS_URL: ${STATUS_URL-https://status.polygraphmcp.dev}
    image: polygraph/web:local
    environment:
      API_ORIGIN: http://api:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-10-13}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/.well-known/security.txt >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
